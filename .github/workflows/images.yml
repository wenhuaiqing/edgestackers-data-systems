# Build both images and publish them to GitHub Container Registry.
#
# The backend image builds the whole platform from code and a seed and checks
# it against infra-azure/build.sha256, so a commit whose output does not match
# the pinned manifest fails here and is never published. The images are tagged
# with the short commit SHA, which is the image_tag Terraform deploys, and
# with latest. The packages are public, so Container Apps pulls with no
# credential; set that once in the package settings after the first run.

name: images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend (builds and verifies the platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
