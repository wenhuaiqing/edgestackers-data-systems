<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Edge Stackers - data systems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; font-family: "Inter", system-ui, sans-serif; }
      *, *::before, *::after { box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      #boot-error {
        display: none; margin: 40px auto; max-width: 860px; padding: 24px 28px;
        border: 1px solid rgba(179,50,63,0.35); border-left: 3px solid #B3323F;
        border-radius: 12px; background: #fff; color: #12161C;
      }
      #boot-error h1 { margin: 0 0 8px; font-size: 16px; }
      #boot-error p { margin: 0 0 12px; font-size: 13px; color: rgba(18,22,28,0.66); line-height: 1.6; }
      #boot-error pre {
        margin: 0; padding: 12px 14px; background: rgba(18,22,28,0.05);
        border-radius: 8px; font-size: 12px; overflow: auto; max-height: 340px;
        white-space: pre-wrap; word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- A load-time failure would otherwise leave a blank page with the reason
         only in the console. Surface it instead. -->
    <div id="boot-error" role="alert">
      <h1>The app did not start</h1>
      <p>This is a load-time failure, so no page rendered. The message below is the first error the browser reported.</p>
      <pre id="boot-error-detail"></pre>
    </div>
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
