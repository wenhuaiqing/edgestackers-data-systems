# Nginx config for the Tapeline frontend container.
#
# - Serves the Vite SPA bundle from /usr/share/nginx/html
# - Falls back to index.html for unknown paths so React Router 7 picks
#   up routes like /pipeline and /triage.
# - Proxies /api and /health to the backend (FastAPI on :8000, the sidecar).
# - A long read timeout on /api: approving a contract change reprocesses
#   the week from raw before it answers.

# DNS resolver for proxy_pass upstreams. Three resolver IPs:
#   127.0.0.11       Docker's embedded DNS (docker-compose service names)
#   168.63.129.16    Azure's virtual DNS -- resolves Container Apps
#                    internal ingress FQDNs
#   169.254.169.253  AWS VPC resolver (legacy Fargate path)
# Whichever responds first wins, so one image runs in compose, ACA and
# ECS without config changes.
resolver 127.0.0.11 168.63.129.16 169.254.169.253 ipv6=off valid=30s;

server {
    listen       80;
    server_name  _;

    # Server-level root so every location block (including the internal
    # redirect to /index.html from the SPA fallback) resolves files from
    # the same path.
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (HSTS, CSP, nosniff, frame denial ...). Re-included
    # in every location that sets its own add_header - nginx drops
    # inherited add_header directives in that case.
    include /etc/nginx/security-headers.conf;

    # Vite hashes filenames -> cache aggressively. index.html is the
    # mutation point -> never cache.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE proxy. The set+$variable pattern defers DNS resolution
    # to request time so nginx starts even when `backend` doesn't exist
    # yet (ECS Fargate: the ALB routes /api requests away from this
    # container before they ever land here; docker-compose: Docker's
    # embedded DNS resolves `backend` to the sibling container).
    location /api/ {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass         http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        # Container Apps' Envoy routes by Host header - it must be the
        # backend's own FQDN, not the public frontend host.
        proxy_set_header   Host              $backend_upstream;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass         http://$backend_upstream/health;
        # HTTP/1.1 explicitly: Container Apps' Envoy ingress answers
        # HTTP/1.0 requests with "426 Upgrade Required".
        proxy_http_version 1.1;
    }
}
