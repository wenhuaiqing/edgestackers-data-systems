# Browser security headers. Included at server level AND inside every
# location that declares its own add_header, because nginx does not
# inherit add_header directives into a block that sets any of its own.
#
# `always` emits them on error responses too.
#
# CSP allowances:
#   style-src   'unsafe-inline' - React inline styles + the index.html
#               <style> block; Google Fonts CSS.
#   font-src    Google Fonts files.
#   img-src     self and data: URIs (chart exports).
#   connect-src 'self' - every API call is same-origin via the proxy.
#   script-src  'self' only - the Vite bundle has no inline scripts.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
